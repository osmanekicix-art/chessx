<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 260px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }
    .header {
      background: #1e1b4b;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 16px; font-weight: 700; color: #818cf8; letter-spacing: 0.5px; }
    .toggle-wrap { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; }
    .toggle { position: relative; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #334155; border-radius: 20px; cursor: pointer; transition: background 0.2s;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 14px; height: 14px; left: 3px; top: 3px;
      background: white; border-radius: 50%; transition: transform 0.2s;
    }
    input:checked + .slider { background: #6366f1; }
    input:checked + .slider::before { transform: translateX(16px); }

    .section { padding: 12px 16px; border-bottom: 1px solid #1e293b; }
    .section-title {
      font-size: 10px; font-weight: 600; color: #475569;
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
    }

    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .mode-btn {
      padding: 7px 0; border: 1px solid #334155; border-radius: 6px;
      background: #1e293b; color: #94a3b8; font-size: 12px; font-weight: 500;
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .mode-btn:hover { border-color: #6366f1; color: #c7d2fe; }
    .mode-btn.active { background: #3730a3; border-color: #6366f1; color: #e0e7ff; font-weight: 700; }
    .mode-desc { margin-top: 6px; font-size: 10px; color: #64748b; min-height: 14px; }

    .color-row { display: flex; gap: 6px; }
    .color-btn {
      flex: 1; padding: 6px 0; border: 1px solid #334155; border-radius: 6px;
      background: #1e293b; color: #94a3b8; font-size: 11px;
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .color-btn:hover { border-color: #6366f1; }
    .color-btn.active { background: #1e3a5f; border-color: #38bdf8; color: #bae6fd; font-weight: 700; }

    /* Preset buttons (time control) */
    .preset-row { display: flex; gap: 6px; }
    .preset-btn {
      flex: 1; padding: 6px 0; border: 1px solid #334155; border-radius: 6px;
      background: #1e293b; color: #94a3b8; font-size: 11px;
      cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .preset-btn:hover { border-color: #a78bfa; color: #ddd6fe; }
    .preset-btn.active { background: #2e1065; border-color: #a78bfa; color: #ddd6fe; font-weight: 700; }

    .slider-row { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { flex: 1; accent-color: #6366f1; cursor: pointer; }
    .slider-val { font-size: 13px; font-weight: 600; color: #818cf8; min-width: 32px; text-align: right; }

    .footer { padding: 10px 16px; text-align: center; font-size: 10px; color: #334155; }
    .hint { font-size: 10px; color: #475569; margin-top: 5px; }

    /* Tab bar */
    .tab-bar { display: flex; border-bottom: 1px solid #1e293b; }
    .tab-btn {
      flex: 1; padding: 9px 0; background: none; border: none; border-bottom: 2px solid transparent;
      color: #64748b; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: #c7d2fe; }
    .tab-btn.active { color: #818cf8; border-bottom-color: #6366f1; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Analiz sekmesi */
    .analiz-wrap { padding: 14px 16px; }
    .pgn-area {
      width: 100%; height: 110px; background: #1e293b; border: 1px solid #334155;
      border-radius: 6px; color: #e2e8f0; font-family: 'Courier New', monospace;
      font-size: 11px; padding: 8px 10px; resize: none; outline: none; transition: border-color 0.2s;
    }
    .pgn-area:focus { border-color: #6366f1; }
    .pgn-area::placeholder { color: #475569; }
    .open-btn {
      margin-top: 10px; width: 100%; padding: 9px 0; background: #3730a3;
      border: none; border-radius: 6px; color: #e0e7ff; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .open-btn:hover { background: #4f46e5; }
    .analiz-hint { font-size: 10px; color: #475569; margin-top: 7px; text-align: center; }
  </style>
</head>
<body>

<div class="header">
  <h1>ChessX</h1>
  <div class="toggle-wrap">
    <span>Aktif</span>
    <label class="toggle">
      <input type="checkbox" id="enabled-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="ayarlar">Ayarlar</button>
  <button class="tab-btn"       data-tab="analiz">Analiz</button>
</div>

<div class="tab-pane active" id="tab-ayarlar">
<div class="section">
  <div class="section-title">Mod</div>
  <div class="mode-grid">
    <button class="mode-btn active" data-mode="legit">Legit</button>
    <button class="mode-btn"       data-mode="semi">Semi</button>
    <button class="mode-btn"       data-mode="rage">Rage</button>
    <button class="mode-btn"       data-mode="manual">Manual</button>
  </div>
  <div class="mode-desc" id="mode-desc">2–3 kasıtlı hata, ağırlıklı hamle seçimi</div>
</div>

<div class="section">
  <div class="section-title">Renk</div>
  <div class="color-row">
    <button class="color-btn active" data-color="auto">Otomatik</button>
    <button class="color-btn"        data-color="white">Beyaz</button>
    <button class="color-btn"        data-color="black">Siyah</button>
  </div>
</div>

<div class="section">
  <div class="section-title">Zaman kontrolü</div>
  <div class="preset-row" id="preset-row">
    <button class="preset-btn" data-preset="1+0">1+0</button>
    <button class="preset-btn" data-preset="1+1">1+1</button>
    <button class="preset-btn" data-preset="2+1">2+1</button>
    <button class="preset-btn" data-preset="3+0">3+0</button>
    <button class="preset-btn" data-preset="3+2">3+2</button>
  </div>
  <div class="hint" id="tc-warn" style="color:#f87171;display:none">⚠ Seçmeden engine başlamaz</div>
</div>

<div class="section">
  <div class="section-title">Analiz derinliği</div>
  <div class="slider-row">
    <input type="range" id="depth-range" min="5" max="22" value="12">
    <span class="slider-val" id="depth-val">12</span>
  </div>
</div>

<div class="section">
  <div class="section-title">Motor gücü (ELO)</div>
  <div class="slider-row">
    <input type="range" id="elo-range" min="800" max="3200" step="100" value="3200">
    <span class="slider-val" id="elo-val">Tam</span>
  </div>
</div>

<div class="section">
  <div class="section-title">Oyun başına hata <span style="color:#475569;font-weight:400">(Legit)</span></div>
  <div class="slider-row">
    <input type="range" id="blunder-range" min="0" max="5" step="1" value="2">
    <span class="slider-val" id="blunder-val">2</span>
  </div>
  <div class="hint">0 = hiç hata yok · 5 = çok sık</div>
</div>

<div class="footer">v1.0.0 · Stockfish engine · \ gizle/göster</div>
</div><!-- /tab-ayarlar -->

<div class="tab-pane" id="tab-analiz">
  <div class="analiz-wrap">
    <div class="section-title">PGN Yapıştır</div>
    <textarea class="pgn-area" id="analiz-pgn" placeholder='[Event "Casual"]&#10;[White "Sen"]&#10;[Black "Rakip"]&#10;[Result "1-0"]&#10;&#10;1. e4 e5 2. Nf3 ...'></textarea>
    <button class="open-btn" id="open-analyzer-btn">Analizi Aç →</button>
    <div class="analiz-hint">Yeni sekmede ayrıntılı rapor açılır</div>
  </div>
</div><!-- /tab-analiz -->

<script src="popup.js"></script>
</body>
</html>
