<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChessX Analiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1e;--surface:#0f172a;--surface2:#1e293b;--border:#334155;
  --fg:#e2e8f0;--muted:#94a3b8;--dim:#475569;
  --accent:#818cf8;--accent2:#6366f1;
  --brilliant:#22d3ee;--best:#4ade80;--excellent:#86efac;
  --good:#60a5fa;--inaccuracy:#fbbf24;--mistake:#fb923c;--blunder:#f87171;
  --forced:#94a3b8;
}
body{background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}

/* Layout */
.app{max-width:960px;margin:0 auto;padding:24px 16px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:0.5px}
.subtitle{font-size:13px;color:var(--muted)}

/* Input panel */
.input-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.input-label{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px}
.pgn-textarea{
  width:100%;height:120px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--fg);font-family:'Courier New',monospace;font-size:12px;
  padding:10px 12px;resize:vertical;outline:none;transition:border-color 0.2s
}
.pgn-textarea:focus{border-color:var(--accent2)}
.pgn-textarea::placeholder{color:var(--dim)}
.controls{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.analyze-btn{
  padding:10px 24px;background:var(--accent2);color:white;border:none;border-radius:8px;
  font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s
}
.analyze-btn:hover{background:#4f46e5}
.analyze-btn:disabled{background:var(--border);color:var(--dim);cursor:not-allowed}
.depth-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.depth-wrap input[type=range]{width:80px;accent-color:var(--accent2)}
.depth-label{color:var(--accent);font-weight:600;min-width:28px}

/* Progress */
.progress-wrap{display:none;margin-top:12px}
.progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent2);border-radius:2px;transition:width 0.3s}
.progress-text{font-size:11px;color:var(--muted);margin-top:5px}

/* Report */
.report{display:none}
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* Game header */
.game-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.gi-row{display:flex;gap:6px;font-size:13px}
.gi-key{color:var(--dim);min-width:100px}
.gi-val{color:var(--fg);font-weight:500}

/* Stats table */
.stats-table{width:100%;border-collapse:collapse;font-size:13px}
.stats-table th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:6px 8px;border-bottom:1px solid var(--border)}
.stats-table td{padding:7px 8px;border-bottom:1px solid #1a2235}
.stats-table td:first-child{color:var(--muted)}
.stats-table td:not(:first-child){font-weight:600;color:var(--fg)}
.acc-val{font-size:16px;font-weight:800;color:var(--accent)}

/* Move table */
.move-table{width:100%;border-collapse:collapse;font-size:13px}
.move-table th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:6px 10px;border-bottom:2px solid var(--border)}
.move-table td{padding:6px 10px;border-bottom:1px solid #1a2235;vertical-align:top}
.move-table tr:hover td{background:#111827}
.move-num{color:var(--dim);font-size:12px}
.move-san{font-family:'Courier New',monospace;font-weight:700;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.b-brilliant{background:#164e63;color:var(--brilliant)}
.b-best{background:#14532d;color:var(--best)}
.b-excellent{background:#1a3a2a;color:var(--excellent)}
.b-good{background:#1e3a5f;color:var(--good)}
.b-inaccuracy{background:#451a03;color:var(--inaccuracy)}
.b-mistake{background:#431407;color:var(--mistake)}
.b-blunder{background:#450a0a;color:var(--blunder)}
.b-forced{background:#1e293b;color:var(--forced)}
.move-desc{font-size:12px;color:var(--muted);margin-top:2px}
.best-alt{font-size:11px;color:var(--dim);font-family:'Courier New',monospace}
.cpl-cell{font-size:12px;color:var(--dim);text-align:right}
.cpl-high{color:var(--blunder)}
.cpl-mid{color:var(--mistake)}

/* Critical moments */
.critical-item{background:var(--surface2);border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:10px}
.critical-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.critical-move{font-family:'Courier New',monospace;font-weight:700;font-size:14px;margin-bottom:4px}
.critical-desc{font-size:12px;color:var(--muted);line-height:1.5}
.ct-blunder{border-color:var(--blunder)}.ct-blunder .critical-type{color:var(--blunder)}
.ct-best{border-color:var(--best)}.ct-best .critical-type{color:var(--best)}
.ct-missed{border-color:var(--inaccuracy)}.ct-missed .critical-type{color:var(--inaccuracy)}
.ct-turning{border-color:var(--accent)}.ct-turning .critical-type{color:var(--accent)}

/* Profile */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-item{background:var(--surface2);border-radius:8px;padding:12px}
.profile-cat{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.profile-stars{display:flex;gap:3px;margin-bottom:4px}
.star{width:14px;height:14px;border-radius:2px;background:var(--border)}
.star.on{background:var(--accent2)}
.profile-note{font-size:12px;color:var(--muted);line-height:1.4}

/* Improvement */
.improvement-item{margin-bottom:14px}
.imp-num{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--accent2);color:white;font-size:11px;font-weight:700;text-align:center;line-height:22px;margin-right:8px;flex-shrink:0}
.imp-title{font-weight:600;font-size:14px;margin-bottom:4px;display:flex;align-items:center}
.imp-body{font-size:13px;color:var(--muted);line-height:1.6;padding-left:30px}
.imp-tip{margin-top:4px;font-size:12px;color:var(--accent);padding-left:30px}

/* Summary */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-item{background:var(--surface2);border-radius:8px;padding:12px}
.sum-label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.sum-val{font-size:14px;font-weight:600;color:var(--fg)}
.sum-val.score{font-size:28px;font-weight:800;color:var(--accent)}
.score-bar{height:6px;background:var(--border);border-radius:3px;margin-top:6px;overflow:hidden}
.score-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blunder),var(--inaccuracy),var(--best))}

/* Error state */
.error-msg{background:#450a0a;border:1px solid #991b1b;border-radius:8px;padding:14px;color:#fca5a5;font-size:13px;margin-top:12px}

@media(max-width:600px){
  .game-info,.summary-grid,.profile-grid{grid-template-columns:1fr}
  .controls{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="logo">ChessX</span>
    <span class="subtitle">Profesyonel Oyun Analizi</span>
  </div>

  <div class="input-panel">
    <div class="input-label">PGN Yapıştır</div>
    <textarea class="pgn-textarea" id="pgn-input" placeholder='[Event "Casual Game"]&#10;[White "Oyuncu1"]&#10;[Black "Oyuncu2"]&#10;[Result "1-0"]&#10;&#10;1. e4 e5 2. Nf3 Nc6 ...'></textarea>
    <div id="error-box" class="error-msg" style="display:none"></div>
    <div class="controls">
      <button class="analyze-btn" id="analyze-btn">Analiz Et</button>
      <div class="depth-wrap">
        <span>Derinlik:</span>
        <input type="range" id="depth-slider" min="8" max="18" value="13">
        <span class="depth-label" id="depth-label">13</span>
        <span style="color:var(--dim);font-size:11px">(daha yüksek = yavaş)</span>
      </div>
    </div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="progress-text">Analiz başlatılıyor…</div>
    </div>
  </div>

  <div class="report" id="report"></div>
</div>
<script type="module" src="analyzer.js"></script>
</body>
</html>
